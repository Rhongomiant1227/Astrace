[project]
name = "astrace"
version = "0.1.0"
description = "AstrBot + NapCat compatible research MCP with shallow/deep/auto modes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.3.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

